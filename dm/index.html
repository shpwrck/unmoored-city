const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){
const enc=new TextEncoder();const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));return new TextDecoder().decode(pt);
}
function showManual(html){const styled=window.BookEdition.prepare(html,'../assets/book/');document.open();document.write(styled);document.close();}
document.getElementById('f').addEventListener('submit',async e=>{
e.preventDefault();const err=document.getElementById('err');err.textContent='';const button=e.currentTarget.querySelector('button');button.disabled=true;button.textContent='Opening…';
const pass=document.getElementById('pw').value;
try{const html=await unlock(pass);try{sessionStorage.setItem('dm-pass',pass);}catch(_){}showManual(html);}
catch(_){err.textContent='That passphrase did not unlock the manual.';button.disabled=false;button.textContent='Open the manual';}
});
(async()=>{try{const p=sessionStorage.getItem('dm-pass');if(p)showManual(await unlock(p));}catch(_){}})();
</script></body></html>
