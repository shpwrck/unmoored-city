<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unmoored City DM Manual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root { color-scheme: light dark; --paper:#EEF1F3; --paper-2:#E3E8EB; --ink:#1C2229; --ink-2:#4A5560; --rule:#C9D1D6; --brass:#9A7A2E; --verdigris:#2F6E67; --bad:#9A3A2E; }
@media (prefers-color-scheme: dark) { :root { --paper:#14191E; --paper-2:#1B2127; --ink:#DDE3E6; --ink-2:#9AA6AF; --rule:#2E373F; --brass:#D0A94F; --verdigris:#6BBFB3; --bad:#E08A7A; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font-family:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif; font-size:17px; }
.card { width:min(92vw, 420px); background:var(--paper-2); border:1px solid var(--rule); border-radius:6px; padding:28px 28px 24px; box-sizing:border-box; }
h1 { font-family:"Spectral",Georgia,serif; font-size:26px; margin:0 0 4px; }
.eyebrow { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--brass); margin:0 0 18px; }
p { margin:0 0 14px; color:var(--ink-2); font-size:15px; }
label { display:block; font-size:13px; color:var(--ink-2); margin-bottom:6px; }
input { width:100%; box-sizing:border-box; font:inherit; padding:10px 12px; border:1px solid var(--rule); border-radius:4px; background:var(--paper); color:var(--ink); }
input:focus-visible { outline:2px solid var(--verdigris); outline-offset:1px; }
button { margin-top:12px; width:100%; font:inherit; font-weight:600; padding:10px 12px; border:0; border-radius:4px; background:var(--verdigris); color:#fff; cursor:pointer; }
button:focus-visible { outline:2px solid var(--brass); outline-offset:2px; }
.err { color:var(--bad); font-size:14px; min-height:1.2em; margin:10px 0 0; }
a { color:var(--verdigris); font-size:14px; }
</style>
</head>
<body>
<form class="card" id="f">

  <label for="pw">Passphrase</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button type="submit">Unlock the manual</button>
  <p class="err" id="err" aria-live="polite"></p>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,b64(DATA));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=document.getElementById('err'); err.textContent='';
  const pass=document.getElementById('pw').value;
  try{
    const html=await unlock(pass);
    try{ sessionStorage.setItem('dm-pass',pass); }catch(_){}
    document.open(); document.write(html); document.close();
  }catch(_){ err.textContent='That passphrase did not unlock the manual.'; }
});
(async()=>{ try{ const p=sessionStorage.getItem('dm-pass'); if(p){ const html=await unlock(p); document.open(); document.write(html); document.close(); } }catch(_){} })();
